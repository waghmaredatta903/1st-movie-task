    <div class="movieModel" id="movieModel">
        <form id="MovieForm">
            <div class="card">
                <div class="card-header d-flex  justify-content-between">
                    <h4 id="addMovie">Add Movie</h4>
                    <h4 id="updateMovie" class="d-none">Update Movie</h4>
                    <i class="fa-regular fa-circle-xmark fa-2x closeModel" role="button"></i>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="title"> Title </label>
                        <input type="text" id="title" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="poster"> Movie Poster </label>
                        <input type="text" id="poster" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="Description"> Movie Description </label>
                        <textarea type="text" id="Description" class="form-control" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="Rating"> Movie Rating </label>
                        <select type="text" id="Rating" class="form-control">

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <input type="date" class="form-control" id="year">
                    </div>

                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-sm btn-sec" id="addMovieBtn"> Add Movie</button>
                    <button type="button" class="btn btn-sm btn-sec d-none" id="updateBtn"> Update Movie</button>
                    <button type="button" class="btn btn-sm btn-pri closeModel"> Close</button>
                </div>
            </div>
        </form>
    </div>
    <div class="backDrop closeModel" id="backDrop"></div>

    <div class="spinner" id="spinner">
        <div class="spinner-border text-danger" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
